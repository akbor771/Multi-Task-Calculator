name: Build MultiCalc Ultra v4 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Complete Android Project
        run: |
          mkdir -p app/src/main/java/com/aktech/multicalc
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MultiRateCalc"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.aktech.multicalc"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.aktech.multicalc"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 4
                  versionName = "4.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="0"
                          android:startY="0"
                          android:endX="108"
                          android:endY="108"
                          android:type="linear">
                          <item android:offset="0" android:color="#064E3B"/>
                          <item android:offset="0.5" android:color="#0F172A"/>
                          <item android:offset="1" android:color="#020617"/>
                      </gradient>
                  </aapt:attr>
              </path>
              <path
                  android:fillColor="#10B981"
                  android:fillAlpha="0.16"
                  android:pathData="M54,12 A42,42 0 1,1 53.9,12 Z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Back stacked tab card -->
              <path
                  android:fillColor="#1E293B"
                  android:strokeColor="#34D399"
                  android:strokeWidth="1.5"
                  android:pathData="M34,22 L76,22 A7,7 0 0,1 83,29 L83,71 A7,7 0 0,1 76,78 L34,78 A7,7 0 0,1 27,71 L27,29 A7,7 0 0,1 34,22 Z" />
              <!-- Front main calculator glass body -->
              <path
                  android:strokeColor="#6EE7B7"
                  android:strokeWidth="1.8"
                  android:pathData="M28,28 L72,28 A8,8 0 0,1 80,36 L80,78 A8,8 0 0,1 72,86 L28,86 A8,8 0 0,1 20,78 L20,36 A8,8 0 0,1 28,28 Z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="20"
                          android:startY="28"
                          android:endX="80"
                          android:endY="86"
                          android:type="linear">
                          <item android:offset="0" android:color="#1E293B"/>
                          <item android:offset="1" android:color="#090D16"/>
                      </gradient>
                  </aapt:attr>
              </path>
              <!-- Display bar -->
              <path
                  android:fillColor="#020617"
                  android:pathData="M27,35 L73,35 A3,3 0 0,1 76,38 L76,47 A3,3 0 0,1 73,50 L27,50 A3,3 0 0,1 24,47 L24,38 A3,3 0 0,1 27,35 Z" />
              <!-- Green accent digits indicator -->
              <path
                  android:fillColor="#10B981"
                  android:pathData="M56,40 L71,40 L71,45 L56,45 Z" />
              <!-- Plus icon -->
              <path
                  android:fillColor="#F8FAFC"
                  android:pathData="M33,56 h3.5 v4.5 h4.5 v3.5 h-4.5 v4.5 h-3.5 v-4.5 h-4.5 v-3.5 h4.5 z" />
              <!-- Multiply icon -->
              <path
                  android:fillColor="#94A3B8"
                  android:pathData="M53,57 L55.5,59.5 L58,57 L60,59 L57.5,61.5 L60,64 L58,66 L55.5,63.5 L53,66 L51,64 L53.5,61.5 L51,59 Z" />
              <!-- Minus icon -->
              <path
                  android:fillColor="#94A3B8"
                  android:pathData="M29,75 h11 v3.5 h-11 z" />
              <!-- Emerald Equals button -->
              <path
                  android:fillColor="#10B981"
                  android:pathData="M50,71 L71,71 A4,4 0 0,1 75,75 L75,78 A4,4 0 0,1 71,82 L50,82 A4,4 0 0,1 46,78 L46,75 A4,4 0 0,1 50,71 Z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M55,74.2 h11 v2 h-11 z M55,77.8 h11 v2 h-11 z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="MultiCalc Ultra"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:windowSoftInputMode="stateAlwaysHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/aktech/multicalc/MainActivity.kt
          package com.aktech.multicalc

          import android.Manifest
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.BasicTextField
          import androidx.compose.foundation.text.selection.LocalTextSelectionColors
          import androidx.compose.foundation.text.selection.SelectionContainer
          import androidx.compose.foundation.text.selection.TextSelectionColors
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.SolidColor
          import androidx.compose.ui.platform.LocalClipboardManager
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalTextInputService
          import androidx.compose.ui.text.AnnotatedString
          import androidx.compose.ui.text.TextRange
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.TextFieldValue
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.DecimalFormat
          import java.util.UUID

          data class CalcTab(
              val id: String = UUID.randomUUID().toString(),
              val name: String,
              val exprValue: TextFieldValue = TextFieldValue(""),
              val result: String = "0"
          ) {
              fun numericResult(): Double {
                  return result.replace(",", "").toDoubleOrNull() ?: 0.0
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      UltraMultiCalcApp()
                  }
              }
          }

          @Composable
          fun UltraMultiCalcApp() {
              val context = LocalContext.current
              val prefs = remember { context.getSharedPreferences("calc_ultra_prefs", Context.MODE_PRIVATE) }
              val coroutineScope = rememberCoroutineScope()

              var apiKey by remember { mutableStateOf(prefs.getString("gemini_api_key", "") ?: "") }
              var isDarkTheme by remember { mutableStateOf(prefs.getBoolean("dark_theme", false)) }
              var showSettings by remember { mutableStateOf(false) }
              var renameTabId by remember { mutableStateOf<String?>(null) }
              var renameText by remember { mutableStateOf("") }
              var isListening by remember { mutableStateOf(false) }
              var isAiThinking by remember { mutableStateOf(false) }

              var tabs by remember {
                  mutableStateOf(
                      listOf(
                          CalcTab(name = "Calc 1"),
                          CalcTab(name = "Calc 2")
                      )
                  )
              }
              var activeTabIndex by remember { mutableIntStateOf(0) }
              val safeIndex = activeTabIndex.coerceIn(0, (tabs.size - 1).coerceAtLeast(0))
              val currentTab = tabs[safeIndex]

              val allTabsTotal = tabs.sumOf { it.numericResult() }
              val formatter = remember { DecimalFormat("#,##0.####") }

              // Samsung-inspired Ultra Clean Light & Dark Palettes
              val bgMain = if (isDarkTheme) Color(0xFF0A0C10) else Color(0xFFF8F9FA)
              val cardSurface = if (isDarkTheme) Color(0xFF151922) else Color(0xFFFFFFFF)
              val keyNumBg = if (isDarkTheme) Color(0xFF161A23) else Color(0xFFFFFFFF)
              val keyOpBg = if (isDarkTheme) Color(0xFF1E2430) else Color(0xFFE9ECEF)
              val keyClearBg = if (isDarkTheme) Color(0xFF241B20) else Color(0xFFFEE2E2)
              val textPrimary = if (isDarkTheme) Color(0xFFF8FAFC) else Color(0xFF111827)
              val textSecondary = if (isDarkTheme) Color(0xFF94A3B8) else Color(0xFF6B7280)
              val accentGreen = Color(0xFF10B981)
              val accentBlue = Color(0xFF2563EB)

              val selectionColors = TextSelectionColors(
                  handleColor = accentBlue,
                  backgroundColor = accentBlue.copy(alpha = 0.25f)
              )

              fun updateExpressionField(newValue: TextFieldValue, autoEval: Boolean = true) {
                  val cleanedText = normalizeBengaliDigits(newValue.text)
                      .replace("*", "×")
                      .replace("/", "÷")
                      .filter { it in "0123456789.+-×÷%()" }
                  val safeSelStart = newValue.selection.start.coerceIn(0, cleanedText.length)
                  val safeSelEnd = newValue.selection.end.coerceIn(0, cleanedText.length)
                  val finalTfv = TextFieldValue(cleanedText, TextRange(safeSelStart, safeSelEnd))

                  val evaluated = if (autoEval) evaluateExpression(cleanedText) else currentTab.result
                  tabs = tabs.mapIndexed { index, tab ->
                      if (index == safeIndex) {
                          tab.copy(exprValue = finalTfv, result = evaluated ?: tab.result)
                      } else tab
                  }
              }

              fun insertAtCursor(strToInsert: String, autoEval: Boolean = true) {
                  val tfv = currentTab.exprValue
                  val text = tfv.text
                  val start = tfv.selection.start.coerceIn(0, text.length)
                  val end = tfv.selection.end.coerceIn(0, text.length)
                  val minIdx = minOf(start, end)
                  val maxIdx = maxOf(start, end)

                  val newText = text.substring(0, minIdx) + strToInsert + text.substring(maxIdx)
                  val newCursor = minIdx + strToInsert.length
                  updateExpressionField(TextFieldValue(newText, TextRange(newCursor)), autoEval)
              }

              fun onButtonPress(label: String) {
                  val tfv = currentTab.exprValue
                  val text = tfv.text
                  when (label) {
                      "C" -> {
                          tabs = tabs.mapIndexed { i, t ->
                              if (i == safeIndex) t.copy(exprValue = TextFieldValue(""), result = "0") else t
                          }
                      }
                      "⌫" -> {
                          val start = tfv.selection.start.coerceIn(0, text.length)
                          val end = tfv.selection.end.coerceIn(0, text.length)
                          if (start != end) {
                              val minIdx = minOf(start, end)
                              val maxIdx = maxOf(start, end)
                              val next = text.removeRange(minIdx, maxIdx)
                              updateExpressionField(TextFieldValue(next, TextRange(minIdx)))
                          } else if (start > 0) {
                              val next = text.removeRange(start - 1, start)
                              updateExpressionField(TextFieldValue(next, TextRange(start - 1)))
                          }
                      }
                      "()" -> {
                          val openCount = text.count { it == '(' }
                          val closeCount = text.count { it == ')' }
                          val bracket = if (openCount > closeCount && text.isNotEmpty() && text.last() in "0123456789)%") ")" else "("
                          insertAtCursor(bracket, autoEval = bracket == ")")
                      }
                      "=" -> {
                          val res = evaluateExpression(text)
                          if (res != null) {
                              val plain = res.replace(",", "")
                              tabs = tabs.mapIndexed { i, t ->
                                  if (i == safeIndex) t.copy(exprValue = TextFieldValue(plain, TextRange(plain.length)), result = res) else t
                              }
                          }
                      }
                      "+", "-", "×", "÷", "%" -> {
                          if (text.isEmpty() && currentTab.result != "0") {
                              val base = currentTab.result.replace(",", "") + label
                              updateExpressionField(TextFieldValue(base, TextRange(base.length)), autoEval = label == "%")
                          } else {
                              insertAtCursor(label, autoEval = label == "%")
                          }
                      }
                      else -> {
                          insertAtCursor(label, autoEval = true)
                      }
                  }
              }

              val permissionLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { granted ->
                  if (!granted) Toast.makeText(context, "Mic permission needed", Toast.LENGTH_SHORT).show()
              }

              fun triggerVoiceCalc() {
                  if (apiKey.isBlank()) {
                      Toast.makeText(context, "সেটিংস থেকে ফ্রি Gemini API Key দিন", Toast.LENGTH_LONG).show()
                      showSettings = true
                      return
                  }
                  if (ContextCompat.checkSelfPermission(context, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      permissionLauncher.launch(Manifest.permission.RECORD_AUDIO)
                      return
                  }

                  val recognizer = SpeechRecognizer.createSpeechRecognizer(context)
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, "bn-BD")
                  }
                  recognizer.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(params: Bundle?) { isListening = true }
                      override fun onResults(results: Bundle?) {
                          isListening = false
                          val spoken = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull() ?: ""
                          if (spoken.isNotBlank()) {
                              isAiThinking = true
                              coroutineScope.launch {
                                  val (mathExpr, errorMsg) = convertVoiceToMath(apiKey, spoken)
                                  isAiThinking = false
                                  if (mathExpr.isNotBlank()) {
                                      updateExpressionField(TextFieldValue(mathExpr, TextRange(mathExpr.length)), autoEval = true)
                                  } else {
                                      Toast.makeText(context, errorMsg ?: "বুঝতে পারিনি: $spoken", Toast.LENGTH_LONG).show()
                                  }
                              }
                          }
                      }
                      override fun onError(error: Int) {
                          isListening = false
                          Toast.makeText(context, "ভয়েস এরর ($error), আবার বলুন", Toast.LENGTH_SHORT).show()
                      }
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(rmsdB: Float) {}
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() { isListening = false }
                      override fun onPartialResults(partialResults: Bundle?) {}
                      override fun onEvent(eventType: Int, params: Bundle?) {}
                  })
                  recognizer.startListening(intent)
              }

              MaterialTheme(colorScheme = if (isDarkTheme) darkColorScheme() else lightColorScheme()) {
                  CompositionLocalProvider(LocalTextSelectionColors provides selectionColors) {
                      Column(
                          modifier = Modifier
                              .fillMaxSize()
                              .background(bgMain)
                              .statusBarsPadding()
                              .navigationBarsPadding()
                      ) {
                          // Top Header Bar
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(horizontal = 16.dp, vertical = 8.dp),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.SpaceBetween
                          ) {
                              Surface(
                                  shape = RoundedCornerShape(14.dp),
                                  color = cardSurface,
                                  border = BorderStroke(1.dp, accentGreen.copy(alpha = 0.35f)),
                                  modifier = Modifier.clickable {
                                      val clip = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                                      val plainTotal = formatter.format(allTabsTotal).replace(",", "")
                                      clip.setPrimaryClip(ClipData.newPlainText("Total", plainTotal))
                                      Toast.makeText(context, "Grand Total Copied: $plainTotal", Toast.LENGTH_SHORT).show()
                                  }
                              ) {
                                  Row(
                                      modifier = Modifier.padding(horizontal = 12.dp, vertical = 6.dp),
                                      verticalAlignment = Alignment.CenterVertically,
                                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                                  ) {
                                      Column {
                                          Text("GRAND TOTAL", fontSize = 9.sp, fontWeight = FontWeight.Bold, color = textSecondary, letterSpacing = 0.8.sp)
                                          Text(
                                              text = formatter.format(allTabsTotal),
                                              fontSize = 18.sp,
                                              fontWeight = FontWeight.ExtraBold,
                                              color = accentGreen
                                          )
                                      }
                                      Icon(Icons.Default.ContentCopy, contentDescription = "Copy", tint = accentGreen, modifier = Modifier.size(16.dp))
                                  }
                              }

                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  IconButton(onClick = {
                                      isDarkTheme = !isDarkTheme
                                      prefs.edit().putBoolean("dark_theme", isDarkTheme).apply()
                                  }) {
                                      Icon(
                                          if (isDarkTheme) Icons.Default.LightMode else Icons.Default.DarkMode,
                                          contentDescription = "Theme",
                                          tint = textSecondary
                                      )
                                  }
                                  IconButton(onClick = { triggerVoiceCalc() }) {
                                      if (isAiThinking) {
                                          CircularProgressIndicator(modifier = Modifier.size(20.dp), strokeWidth = 2.dp, color = accentBlue)
                                      } else {
                                          Icon(
                                              Icons.Default.Mic,
                                              contentDescription = "Voice",
                                              tint = if (isListening) Color(0xFFEF4444) else accentBlue
                                          )
                                      }
                                  }
                                  IconButton(onClick = { showSettings = true }) {
                                      Icon(Icons.Default.Settings, contentDescription = "Settings", tint = textSecondary)
                                  }
                              }
                          }

                          // Multi-Tab Strip
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(horizontal = 14.dp)
                                  .horizontalScroll(rememberScrollState()),
                              horizontalArrangement = Arrangement.spacedBy(8.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              tabs.forEachIndexed { index, tab ->
                                  val selected = index == safeIndex
                                  Surface(
                                      shape = RoundedCornerShape(14.dp),
                                      color = if (selected) accentGreen else cardSurface,
                                      border = if (!selected) BorderStroke(1.dp, textSecondary.copy(alpha = 0.15f)) else null,
                                      shadowElevation = if (selected) 3.dp else 0.dp,
                                      modifier = Modifier.clickable { activeTabIndex = index }
                                  ) {
                                      Row(
                                          modifier = Modifier.padding(horizontal = 12.dp, vertical = 7.dp),
                                          verticalAlignment = Alignment.CenterVertically,
                                          horizontalArrangement = Arrangement.spacedBy(6.dp)
                                      ) {
                                          Column(modifier = Modifier.clickable {
                                              if (selected) {
                                                  renameTabId = tab.id
                                                  renameText = tab.name
                                              } else {
                                                  activeTabIndex = index
                                              }
                                          }) {
                                              Text(
                                                  text = tab.name,
                                                  fontSize = 11.sp,
                                                  fontWeight = FontWeight.Medium,
                                                  color = if (selected) Color.White.copy(alpha = 0.9f) else textSecondary,
                                                  maxLines = 1,
                                                  overflow = TextOverflow.Ellipsis
                                              )
                                              Text(
                                                  text = tab.result,
                                                  fontSize = 14.sp,
                                                  fontWeight = FontWeight.Bold,
                                                  color = if (selected) Color.White else textPrimary,
                                                  maxLines = 1
                                              )
                                          }
                                          if (tabs.size > 1) {
                                              Icon(
                                                  Icons.Default.Close,
                                                  contentDescription = "Close Tab",
                                                  tint = if (selected) Color.White.copy(alpha = 0.8f) else textSecondary,
                                                  modifier = Modifier
                                                      .size(15.dp)
                                                      .clickable {
                                                          tabs = tabs.filterIndexed { i, _ -> i != index }
                                                          if (activeTabIndex >= tabs.size) activeTabIndex = tabs.size - 1
                                                      }
                                              )
                                          }
                                      }
                                  }
                              }

                              Surface(
                                  shape = CircleShape,
                                  color = cardSurface,
                                  border = BorderStroke(1.dp, textSecondary.copy(alpha = 0.2f)),
                                  modifier = Modifier
                                      .size(38.dp)
                                      .clickable {
                                          tabs = tabs + CalcTab(name = "Calc ${tabs.size + 1}")
                                          activeTabIndex = tabs.size - 1
                                      }
                              ) {
                                  Box(contentAlignment = Alignment.Center) {
                                      Icon(Icons.Default.Add, contentDescription = "Add Calc", tint = textPrimary, modifier = Modifier.size(20.dp))
                                  }
                              }
                          }

                          // Display with Native Cursor & Drag-Handle Copy/Cut/Paste (No Soft Keyboard!)
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .weight(0.35f)
                                  .padding(horizontal = 22.dp, vertical = 10.dp),
                              verticalArrangement = Arrangement.Bottom,
                              horizontalAlignment = Alignment.End
                          ) {
                              if (isListening) {
                                  Text(
                                      text = "Listening...",
                                      fontSize = 26.sp,
                                      fontWeight = FontWeight.Medium,
                                      color = accentBlue,
                                      textAlign = TextAlign.End
                                  )
                              } else {
                                  // Suppress soft keyboard while keeping native selection handles & Cut/Copy/Paste toolbar
                                  CompositionLocalProvider(LocalTextInputService provides null) {
                                      BasicTextField(
                                          value = currentTab.exprValue,
                                          onValueChange = { newTfv -> updateExpressionField(newTfv) },
                                          textStyle = TextStyle(
                                              fontSize = 32.sp,
                                              fontWeight = FontWeight.Normal,
                                              color = textPrimary,
                                              textAlign = TextAlign.End
                                          ),
                                          cursorBrush = SolidColor(accentBlue),
                                          modifier = Modifier.fillMaxWidth(),
                                          decorationBox = { innerTextField ->
                                              Box(
                                                  modifier = Modifier.fillMaxWidth(),
                                                  contentAlignment = Alignment.CenterEnd
                                              ) {
                                                  if (currentTab.exprValue.text.isEmpty()) {
                                                      Text(
                                                          text = "0",
                                                          fontSize = 36.sp,
                                                          color = textSecondary.copy(alpha = 0.4f),
                                                          textAlign = TextAlign.End
                                                      )
                                                  }
                                                  innerTextField()
                                              }
                                          }
                                      )
                                  }
                              }

                              Spacer(Modifier.height(10.dp))

                              // Selectable Live Preview Result (Drag to copy specific digits of result too!)
                              SelectionContainer {
                                  Text(
                                      text = currentTab.result,
                                      fontSize = 42.sp,
                                      fontWeight = FontWeight.Bold,
                                      color = textSecondary,
                                      textAlign = TextAlign.End,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis
                                  )
                              }
                          }

                          Divider(color = textSecondary.copy(alpha = 0.12f), thickness = 1.dp, modifier = Modifier.padding(horizontal = 18.dp))

                          // Samsung OneUI-Style Circular/Pill Keypad
                          val buttonRows = listOf(
                              listOf("C", "⌫", "%", "÷"),
                              listOf("7", "8", "9", "×"),
                              listOf("4", "5", "6", "-"),
                              listOf("1", "2", "3", "+"),
                              listOf("()", "0", ".", "=")
                          )

                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .weight(0.65f)
                                  .padding(horizontal = 16.dp, vertical = 12.dp),
                              verticalArrangement = Arrangement.spacedBy(12.dp)
                          ) {
                              buttonRows.forEach { row ->
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .weight(1f),
                                      horizontalArrangement = Arrangement.spacedBy(12.dp)
                                  ) {
                                      row.forEach { btn ->
                                          val bgColor = when (btn) {
                                              "=" -> accentGreen
                                              "C" -> keyClearBg
                                              "⌫", "%", "÷", "×", "-", "+" -> keyOpBg
                                              else -> keyNumBg
                                          }
                                          val labelColor = when (btn) {
                                              "=" -> Color.White
                                              "C" -> Color(0xFFEF4444)
                                              "⌫" -> Color(0xFFEF4444)
                                              "%", "÷", "×", "-", "+" -> accentGreen
                                              else -> textPrimary
                                          }

                                          Surface(
                                              shape = CircleShape,
                                              color = bgColor,
                                              shadowElevation = if (!isDarkTheme && bgColor == keyNumBg) 1.dp else 0.dp,
                                              modifier = Modifier
                                                  .weight(1f)
                                                  .fillMaxHeight()
                                                  .clip(CircleShape)
                                                  .clickable { onButtonPress(btn) }
                                          ) {
                                              Box(contentAlignment = Alignment.Center) {
                                                  Text(
                                                      text = btn,
                                                      fontSize = 26.sp,
                                                      fontWeight = if (btn == "=") FontWeight.Bold else FontWeight.Medium,
                                                      color = labelColor
                                                  )
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }

                  if (renameTabId != null) {
                      AlertDialog(
                          onDismissRequest = { renameTabId = null },
                          title = { Text("Tab Name") },
                          text = {
                              OutlinedTextField(
                                  value = renameText,
                                  onValueChange = { renameText = it },
                                  placeholder = { Text("e.g. Payoneer / Student") },
                                  singleLine = true
                              )
                          },
                          confirmButton = {
                              Button(onClick = {
                                  tabs = tabs.map { if (it.id == renameTabId) it.copy(name = renameText.ifBlank { it.name }) else it }
                                  renameTabId = null
                              }) { Text("Save") }
                          }
                      )
                  }

                  if (showSettings) {
                      AlertDialog(
                          onDismissRequest = { showSettings = false },
                          title = { Text("Gemini API Key") },
                          text = {
                              Column {
                                  Text("Google AI Studio থেকে নেওয়া ফ্রি API Key পেস্ট করুন:", fontSize = 13.sp)
                                  Spacer(Modifier.height(8.dp))
                                  OutlinedTextField(
                                      value = apiKey,
                                      onValueChange = { apiKey = it },
                                      placeholder = { Text("AIzaSy...") },
                                      singleLine = true
                                  )
                              }
                          },
                          confirmButton = {
                              Button(onClick = {
                                  prefs.edit().putString("gemini_api_key", apiKey.trim()).apply()
                                  showSettings = false
                                  Toast.makeText(context, "API Key Saved!", Toast.LENGTH_SHORT).show()
                              }) { Text("Save") }
                          }
                      )
                  }
              }
          }

          fun normalizeBengaliDigits(input: String): String {
              val bn = charArrayOf('০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯')
              var out = input
              for (i in bn.indices) {
                  out = out.replace(bn[i], ('0'.code + i).toChar())
              }
              return out
          }

          fun evaluateExpression(raw: String): String? {
              if (raw.isBlank()) return "0"
              return try {
                  val clean = normalizeBengaliDigits(raw)
                      .replace(",", "")
                      .replace("×", "*")
                      .replace("÷", "/")
                      .replace("%", "/100.0")
                      .trimEnd('+', '-', '*', '/')
                  if (clean.isBlank()) return "0"

                  val result = object : Any() {
                      var pos = -1
                      var ch = 0
                      fun nextChar() { ch = if (++pos < clean.length) clean[pos].code else -1 }
                      fun eat(charToEat: Int): Boolean {
                          while (ch == ' '.code) nextChar()
                          if (ch == charToEat) { nextChar(); return true }
                          return false
                      }
                      fun parse(): Double {
                          nextChar()
                          val x = parseExpression()
                          if (pos < clean.length) throw RuntimeException("Unexpected")
                          return x
                      }
                      fun parseExpression(): Double {
                          var x = parseTerm()
                          while (true) {
                              if (eat('+'.code)) x += parseTerm()
                              else if (eat('-'.code)) x -= parseTerm()
                              else return x
                          }
                      }
                      fun parseTerm(): Double {
                          var x = parseFactor()
                          while (true) {
                              if (eat('*'.code)) x *= parseFactor()
                              else if (eat('/'.code)) x /= parseFactor()
                              else return x
                          }
                      }
                      fun parseFactor(): Double {
                          if (eat('+'.code)) return parseFactor()
                          if (eat('-'.code)) return -parseFactor()
                          var x: Double
                          val startPos = pos
                          if (eat('('.code)) {
                              x = parseExpression()
                              eat(')'.code)
                          } else if ((ch >= '0'.code && ch <= '9'.code) || ch == '.'.code) {
                              while ((ch >= '0'.code && ch <= '9'.code) || ch == '.'.code) nextChar()
                              x = clean.substring(startPos, pos).toDouble()
                          } else throw RuntimeException("Unexpected")
                          return x
                      }
                  }.parse()

                  if (result.isNaN() || result.isInfinite()) return null
                  DecimalFormat("#,##0.####").format(result)
              } catch (e: Exception) {
                  null
              }
          }

          suspend fun convertVoiceToMath(apiKey: String, spoken: String): Pair<String, String?> = withContext(Dispatchers.IO) {
              val modelsToTry = listOf("gemini-2.5-flash-lite", "gemini-3-flash-preview", "gemini-2.0-flash")
              val normalizedSpoken = normalizeBengaliDigits(spoken)
              var lastError = "API Error"

              for (model in modelsToTry) {
                  try {
                      val url = URL("https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent?key=$apiKey")
                      val conn = (url.openConnection() as HttpURLConnection).apply {
                          requestMethod = "POST"
                          setRequestProperty("Content-Type", "application/json")
                          connectTimeout = 10000
                          readTimeout = 10000
                          doOutput = true
                      }
                      val prompt = """
                          Convert the spoken math phrase into a pure arithmetic expression using ONLY English digits (0-9) and operators (+, -, ×, ÷, %, .).
                          Examples:
                          "100 যোগ 10" -> 100+10
                          "500 বিয়োগ 50" -> 500-50
                          "150 গুন 119" -> 150×119
                          "1000 ভাগ 8" -> 1000÷8
                          "200 এর 5 পার্সেন্ট" -> 200×5%
                          Output ONLY the math expression with no spaces, no explanation, no markdown.
                          Spoken text: "$normalizedSpoken"
                      """.trimIndent()

                      val body = JSONObject().apply {
                          put("contents", JSONArray().put(JSONObject().apply {
                              put("parts", JSONArray().put(JSONObject().put("text", prompt)))
                          }))
                      }
                      conn.outputStream.use { it.write(body.toString().toByteArray()) }

                      val code = conn.responseCode
                      if (code in 200..299) {
                          val response = JSONObject(conn.inputStream.bufferedReader().readText())
                          val rawExpr = response.getJSONArray("candidates")
                              .getJSONObject(0)
                              .getJSONObject("content")
                              .getJSONArray("parts")
                              .getJSONObject(0)
                              .getString("text")

                          val cleanExpr = normalizeBengaliDigits(rawExpr)
                              .replace("*", "×")
                              .replace("/", "÷")
                              .replace(" ", "")
                              .filter { it in "0123456789.+-×÷%()" }

                          if (cleanExpr.isNotBlank()) return@withContext Pair(cleanExpr, null)
                      } else {
                          val errBody = conn.errorStream?.bufferedReader()?.readText() ?: "HTTP $code"
                          lastError = try {
                              JSONObject(errBody).getJSONObject("error").getString("message")
                          } catch (_: Exception) { "API Error ($code)" }
                      }
                  } catch (e: Exception) {
                      lastError = "Network Error: ${e.localizedMessage}"
                  }
              }
              Pair("", lastError)
          }
