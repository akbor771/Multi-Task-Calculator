name: Build MultiRate AI Calc APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Complete Android Project
        run: |
          mkdir -p app/src/main/java/com/aktech/multicalc

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MultiRateCalc"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.aktech.multicalc"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.aktech.multicalc"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "2.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:allowBackup="true"
                  android:label="MultiCalc Pro"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/aktech/multicalc/MainActivity.kt
          package com.aktech.multicalc

          import android.Manifest
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.DecimalFormat
          import java.util.UUID

          data class CalcTab(
              val id: String = UUID.randomUUID().toString(),
              val name: String,
              val expression: String = "",
              val result: String = "0"
          ) {
              fun numericResult(): Double {
                  return result.replace(",", "").toDoubleOrNull() ?: 0.0
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme()) {
                          StandardMultiCalcApp()
                      }
                  }
              }
          }

          @Composable
          fun StandardMultiCalcApp() {
              val context = LocalContext.current
              val prefs = remember { context.getSharedPreferences("calc_pro_prefs", Context.MODE_PRIVATE) }
              val coroutineScope = rememberCoroutineScope()

              var apiKey by remember { mutableStateOf(prefs.getString("gemini_api_key", "") ?: "") }
              var showSettings by remember { mutableStateOf(false) }
              var renameTabId by remember { mutableStateOf<String?>(null) }
              var renameText by remember { mutableStateOf("") }
              var isListening by remember { mutableStateOf(false) }
              var isAiThinking by remember { mutableStateOf(false) }

              var tabs by remember {
                  mutableStateOf(
                      listOf(
                          CalcTab(name = "Calc 1"),
                          CalcTab(name = "Calc 2")
                      )
                  )
              }
              var activeTabIndex by remember { mutableIntStateOf(0) }
              val safeIndex = activeTabIndex.coerceIn(0, (tabs.size - 1).coerceAtLeast(0))
              val currentTab = tabs[safeIndex]

              val allTabsTotal = tabs.sumOf { it.numericResult() }
              val formatter = remember { DecimalFormat("#,##0.####") }

              fun updateCurrentTab(newExpr: String, autoEval: Boolean = true) {
                  val evaluated = if (autoEval) evaluateExpression(newExpr) else currentTab.result
                  tabs = tabs.mapIndexed { index, tab ->
                      if (index == safeIndex) {
                          tab.copy(expression = newExpr, result = evaluated ?: tab.result)
                      } else tab
                  }
              }

              fun onButtonPress(label: String) {
                  val expr = currentTab.expression
                  when (label) {
                      "AC" -> {
                          tabs = tabs.mapIndexed { i, t -> if (i == safeIndex) t.copy(expression = "", result = "0") else t }
                      }
                      "⌫" -> {
                          if (expr.isNotEmpty()) {
                              val next = expr.dropLast(1)
                              if (next.isEmpty()) {
                                  tabs = tabs.mapIndexed { i, t -> if (i == safeIndex) t.copy(expression = "", result = "0") else t }
                              } else {
                                  updateCurrentTab(next)
                              }
                          }
                      }
                      "=" -> {
                          val res = evaluateExpression(expr)
                          if (res != null) {
                              tabs = tabs.mapIndexed { i, t -> if (i == safeIndex) t.copy(expression = res, result = res) else t }
                          }
                      }
                      "+", "-", "×", "÷", "%" -> {
                          if (expr.isEmpty() && currentTab.result != "0") {
                              updateCurrentTab(currentTab.result + label, autoEval = false)
                          } else if (expr.isNotEmpty()) {
                              val last = expr.last()
                              val next = if (last in listOf('+', '-', '×', '÷')) expr.dropLast(1) + label else expr + label
                              updateCurrentTab(next, autoEval = label == "%")
                          }
                      }
                      else -> {
                          val next = if (expr == "0" && label != ".") label else expr + label
                          updateCurrentTab(next)
                      }
                  }
              }

              val permissionLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { granted ->
                  if (!granted) Toast.makeText(context, "Mic permission needed", Toast.LENGTH_SHORT).show()
              }

              fun triggerVoiceCalc() {
                  if (apiKey.isBlank()) {
                      Toast.makeText(context, "সেটিংস থেকে ফ্রি Gemini API Key দিন", Toast.LENGTH_LONG).show()
                      showSettings = true
                      return
                  }
                  if (ContextCompat.checkSelfPermission(context, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      permissionLauncher.launch(Manifest.permission.RECORD_AUDIO)
                      return
                  }

                  val recognizer = SpeechRecognizer.createSpeechRecognizer(context)
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, "bn-BD")
                  }
                  recognizer.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(params: Bundle?) { isListening = true }
                      override fun onResults(results: Bundle?) {
                          isListening = false
                          val spoken = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull() ?: ""
                          if (spoken.isNotBlank()) {
                              isAiThinking = true
                              coroutineScope.launch {
                                  val mathExpr = convertVoiceToMath(apiKey, spoken)
                                  isAiThinking = false
                                  if (mathExpr.isNotBlank()) {
                                      updateCurrentTab(mathExpr)
                                  } else {
                                      Toast.makeText(context, "বুঝতে পারিনি: $spoken", Toast.LENGTH_SHORT).show()
                                  }
                              }
                          }
                      }
                      override fun onError(error: Int) { isListening = false }
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(rmsdB: Float) {}
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() { isListening = false }
                      override fun onPartialResults(partialResults: Bundle?) {}
                      override fun onEvent(eventType: Int, params: Bundle?) {}
                  })
                  recognizer.startListening(intent)
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color(0xFF0D0F14))
                      .statusBarsPadding()
                      .navigationBarsPadding()
              ) {
                  // Top Bar: Combined Total & Actions
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 16.dp, vertical = 10.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.SpaceBetween
                  ) {
                      Column(
                          modifier = Modifier.clickable {
                              val clip = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                              clip.setPrimaryClip(ClipData.newPlainText("Total", formatter.format(allTabsTotal)))
                              Toast.makeText(context, "Grand Total কপি হয়েছে!", Toast.LENGTH_SHORT).show()
                          }
                      ) {
                          Text("ALL TABS TOTAL", fontSize = 10.sp, color = Color(0xFF8E95A5), letterSpacing = 1.sp)
                          Text(
                              text = formatter.format(allTabsTotal),
                              fontSize = 20.sp,
                              fontWeight = FontWeight.Bold,
                              color = Color(0xFF4ADE80)
                          )
                      }

                      Row(verticalAlignment = Alignment.CenterVertically) {
                          IconButton(onClick = { triggerVoiceCalc() }) {
                              if (isAiThinking) {
                                  CircularProgressIndicator(modifier = Modifier.size(20.dp), strokeWidth = 2.dp, color = Color(0xFF60A5FA))
                              } else {
                                  Icon(
                                      Icons.Default.Mic,
                                      contentDescription = "Voice",
                                      tint = if (isListening) Color(0xFFEF4444) else Color(0xFF60A5FA)
                                  )
                              }
                          }
                          IconButton(onClick = { showSettings = true }) {
                              Icon(Icons.Default.Settings, contentDescription = "Settings", tint = Color(0xFF9CA3AF))
                          }
                      }
                  }

                  // Multi-Calculator Tabs Row
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 12.dp)
                          .horizontalScroll(rememberScrollState()),
                      horizontalArrangement = Arrangement.spacedBy(8.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      tabs.forEachIndexed { index, tab ->
                          val selected = index == safeIndex
                          Surface(
                              shape = RoundedCornerShape(14.dp),
                              color = if (selected) Color(0xFF2563EB) else Color(0xFF1A1E29),
                              modifier = Modifier.clickable { activeTabIndex = index }
                          ) {
                              Row(
                                  modifier = Modifier.padding(horizontal = 12.dp, vertical = 8.dp),
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.spacedBy(6.dp)
                              ) {
                                  Column(modifier = Modifier.clickable {
                                      if (selected) {
                                          renameTabId = tab.id
                                          renameText = tab.name
                                      } else {
                                          activeTabIndex = index
                                      }
                                  }) {
                                      Text(
                                          text = tab.name,
                                          fontSize = 11.sp,
                                          color = if (selected) Color.White.copy(alpha = 0.85f) else Color(0xFF9CA3AF),
                                          maxLines = 1,
                                          overflow = TextOverflow.Ellipsis
                                      )
                                      Text(
                                          text = tab.result,
                                          fontSize = 14.sp,
                                          fontWeight = FontWeight.Bold,
                                          color = Color.White,
                                          maxLines = 1
                                      )
                                  }
                                  if (tabs.size > 1) {
                                      Icon(
                                          Icons.Default.Close,
                                          contentDescription = "Close Tab",
                                          tint = Color.White.copy(alpha = 0.6f),
                                          modifier = Modifier
                                              .size(15.dp)
                                              .clickable {
                                                  tabs = tabs.filterIndexed { i, _ -> i != index }
                                                  if (activeTabIndex >= tabs.size) activeTabIndex = tabs.size - 1
                                              }
                                      )
                                  }
                              }
                          }
                      }

                      // Add New Tab Button
                      FilledIconButton(
                          onClick = {
                              tabs = tabs + CalcTab(name = "Calc ${tabs.size + 1}")
                              activeTabIndex = tabs.size - 1
                          },
                          colors = IconButtonDefaults.filledIconButtonColors(containerColor = Color(0xFF1A1E29)),
                          modifier = Modifier.size(40.dp)
                      ) {
                          Icon(Icons.Default.Add, contentDescription = "New Calc", tint = Color.White)
                      }
                  }

                  // Main Calculator Display Area
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .weight(0.36f)
                          .padding(horizontal = 20.dp, vertical = 12.dp),
                      verticalArrangement = Arrangement.Bottom,
                      horizontalAlignment = Alignment.End
                  ) {
                      Text(
                          text = if (isListening) "Listening..." else currentTab.expression,
                          fontSize = 24.sp,
                          color = if (isListening) Color(0xFF60A5FA) else Color(0xFF9CA3AF),
                          textAlign = TextAlign.End,
                          maxLines = 2,
                          overflow = TextOverflow.Ellipsis
                      )
                      Spacer(Modifier.height(8.dp))
                      Text(
                          text = currentTab.result,
                          fontSize = 48.sp,
                          fontWeight = FontWeight.Bold,
                          color = Color.White,
                          textAlign = TextAlign.End,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis
                      )
                  }

                  // Standard Calculator Keypad
                  val buttonRows = listOf(
                      listOf("AC", "⌫", "%", "÷"),
                      listOf("7", "8", "9", "×"),
                      listOf("4", "5", "6", "-"),
                      listOf("1", "2", "3", "+"),
                      listOf("00", "0", ".", "=")
                  )

                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .weight(0.64f)
                          .padding(horizontal = 14.dp, vertical = 10.dp),
                      verticalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      buttonRows.forEach { row ->
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .weight(1f),
                              horizontalArrangement = Arrangement.spacedBy(10.dp)
                          ) {
                              row.forEach { btn ->
                                  val bgColor = when (btn) {
                                      "=" -> Color(0xFF2563EB)
                                      "÷", "×", "-", "+" -> Color(0xFF1E293B)
                                      "AC", "⌫", "%" -> Color(0xFF272B38)
                                      else -> Color(0xFF161922)
                                  }
                                  val textColor = when (btn) {
                                      "AC" -> Color(0xFFF87171)
                                      "÷", "×", "-", "+", "%" -> Color(0xFF60A5FA)
                                      else -> Color.White
                                  }

                                  Box(
                                      contentAlignment = Alignment.Center,
                                      modifier = Modifier
                                          .weight(1f)
                                          .fillMaxHeight()
                                          .clip(RoundedCornerShape(22.dp))
                                          .background(bgColor)
                                          .clickable { onButtonPress(btn) }
                                  ) {
                                      Text(
                                          text = btn,
                                          fontSize = 24.sp,
                                          fontWeight = FontWeight.SemiBold,
                                          color = textColor
                                      )
                                  }
                              }
                          }
                      }
                  }
              }

              // Rename Tab Dialog
              if (renameTabId != null) {
                  AlertDialog(
                      onDismissRequest = { renameTabId = null },
                      title = { Text("Tab Name") },
                      text = {
                          OutlinedTextField(
                              value = renameText,
                              onValueChange = { renameText = it },
                              placeholder = { Text("e.g. Payoneer / Student") },
                              singleLine = true
                          )
                      },
                      confirmButton = {
                          Button(onClick = {
                              tabs = tabs.map { if (it.id == renameTabId) it.copy(name = renameText.ifBlank { it.name }) else it }
                              renameTabId = null
                          }) { Text("Save") }
                      }
                  )
              }

              // Gemini API Key Dialog
              if (showSettings) {
                  AlertDialog(
                      onDismissRequest = { showSettings = false },
                      title = { Text("Gemini API Key (Optional)") },
                      text = {
                          Column {
                              Text("AI Voice ব্যবহার করতে চাইলে ফ্রি API Key দিন:", fontSize = 13.sp)
                              Spacer(Modifier.height(8.dp))
                              OutlinedTextField(
                                  value = apiKey,
                                  onValueChange = { apiKey = it },
                                  placeholder = { Text("AIzaSy...") },
                                  singleLine = true
                              )
                          }
                      },
                      confirmButton = {
                          Button(onClick = {
                              prefs.edit().putString("gemini_api_key", apiKey.trim()).apply()
                              showSettings = false
                              Toast.makeText(context, "Saved!", Toast.LENGTH_SHORT).show()
                          }) { Text("Save") }
                      }
                  )
              }
          }

          fun evaluateExpression(raw: String): String? {
              if (raw.isBlank()) return "0"
              return try {
                  val clean = raw
                      .replace(",", "")
                      .replace("×", "*")
                      .replace("÷", "/")
                      .replace("%", "/100.0")
                      .trimEnd('+', '-', '*', '/')
                  if (clean.isBlank()) return "0"

                  val result = object : Any() {
                      var pos = -1
                      var ch = 0
                      fun nextChar() { ch = if (++pos < clean.length) clean[pos].code else -1 }
                      fun eat(charToEat: Int): Boolean {
                          while (ch == ' '.code) nextChar()
                          if (ch == charToEat) { nextChar(); return true }
                          return false
                      }
                      fun parse(): Double {
                          nextChar()
                          val x = parseExpression()
                          if (pos < clean.length) throw RuntimeException("Unexpected")
                          return x
                      }
                      fun parseExpression(): Double {
                          var x = parseTerm()
                          while (true) {
                              if (eat('+'.code)) x += parseTerm()
                              else if (eat('-'.code)) x -= parseTerm()
                              else return x
                          }
                      }
                      fun parseTerm(): Double {
                          var x = parseFactor()
                          while (true) {
                              if (eat('*'.code)) x *= parseFactor()
                              else if (eat('/'.code)) x /= parseFactor()
                              else return x
                          }
                      }
                      fun parseFactor(): Double {
                          if (eat('+'.code)) return parseFactor()
                          if (eat('-'.code)) return -parseFactor()
                          var x: Double
                          val startPos = pos
                          if (eat('('.code)) {
                              x = parseExpression()
                              eat(')'.code)
                          } else if ((ch >= '0'.code && ch <= '9'.code) || ch == '.'.code) {
                              while ((ch >= '0'.code && ch <= '9'.code) || ch == '.'.code) nextChar()
                              x = clean.substring(startPos, pos).toDouble()
                          } else throw RuntimeException("Unexpected")
                          return x
                      }
                  }.parse()

                  if (result.isNaN() || result.isInfinite()) return null
                  DecimalFormat("#,##0.####").format(result)
              } catch (e: Exception) {
                  null
              }
          }

          suspend fun convertVoiceToMath(apiKey: String, spoken: String): String = withContext(Dispatchers.IO) {
              try {
                  val url = URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$apiKey")
                  val conn = (url.openConnection() as HttpURLConnection).apply {
                      requestMethod = "POST"
                      setRequestProperty("Content-Type", "application/json")
                      doOutput = true
                  }
                  val prompt = "Convert this Bengali/English math voice command into a pure math expression using only digits and +, -, ×, ÷, %. Example: '100 gun 119 biyog 2 percent' -> '100×119-2%'. Return ONLY the math expression, nothing else. Input: \"$spoken\""
                  val body = JSONObject().apply {
                      put("contents", JSONArray().put(JSONObject().apply {
                          put("parts", JSONArray().put(JSONObject().put("text", prompt)))
                      }))
                  }
                  conn.outputStream.use { it.write(body.toString().toByteArray()) }
                  val response = JSONObject(conn.inputStream.bufferedReader().readText())
                  response.getJSONArray("candidates")
                      .getJSONObject(0)
                      .getJSONObject("content")
                      .getJSONArray("parts")
                      .getJSONObject(0)
                      .getString("text")
                      .replace("*", "×")
                      .replace("/", "÷")
                      .trim()
              } catch (e: Exception) {
                  ""
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MultiCalc-Pro-v2
          path: app/build/outputs/apk/debug/app-debug.apk
